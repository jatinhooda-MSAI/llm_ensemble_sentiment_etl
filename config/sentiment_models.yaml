# Sentiment scoring: which models label each article, and how runs behave.
# Changing a model_id, the prompt or a model's country_field creates a new
# model_version automatically (registered in gold.dim_model_version); the
# old one is retired.
# Pin exact model versions here, never a "latest" alias.

prompt_name: tag_and_sentiment_v1
prompt_path: etl/sentiment_scoring/prompts/tag_and_sentiment_v1.md

schedule:                      # UTC; used by the deploy commands
  scoring_cron: "0 6,18 * * *" # submit batches + run serial models, twice a day
  collect_cron: "30 * * * *"   # collect finished batches, rebuild the series

run_limits:
  max_docs_per_model: 2000     # cap per scheduled run, per model
  lookback_days: 7             # scheduled runs only score articles published this recently
  serial_concurrency: 2        # parallel requests for SERIAL models (Gemma capacity is shared; 429s at 4)

aggregation:
  window_days: 14              # each run rebuilds this many trailing days
  min_docs: 3                  # below this a country-day is flagged LOW coverage (still shown)
  min_outlets: 2

bias:
  window_days: 14
  min_per_language: 10         # a language needs this many articles to enter the KL check

# A batch job must read/write a dataset in its own location:
#   Gemini batch: global endpoint + dataset batch (us-central1)  (verified 2026-10-24)
#   Claude batch: not available until the model is enabled in Model Garden
models:
  - slot: gemini
    provider: GOOGLE
    model_id: gemini-3.8-flash        # GA 2026-09-02; global/us/eu only
    call_mode: BATCH
    location: global
    batch_dataset: batch
    max_output_tokens: 4096
    enabled: true
  - slot: claude
    provider: ANTHROPIC
    model_id: claude-sonnet-5-5
    call_mode: BATCH
    location: us-central1             # TODO verify once enabled in Model Garden
    batch_dataset: batch
    max_output_tokens: 4096           # adaptive thinking at low effort counts toward this
    enabled: false                    # blocked on Vertex until enabled in Model Garden; history
                                      # loaded via `run_sentiment_scoring.py claude-history`
  - slot: gemma
    provider: GOOGLE_OPEN
    model_id: gemma-4-26b-a4b-it-maas # Experimental MaaS; global only; no batch
    call_mode: SERIAL
    location: global
    max_output_tokens: 2048
    country_field: free               # the African-code enum forced look-alike codes
                                      # (Saudi Arabia -> Sudan); tested 2026-10-25
    enabled: true
