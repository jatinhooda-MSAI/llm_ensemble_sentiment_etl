# Build the labeling app image as the pipeline's service account (the default compute SA lacks
# access to the Cloud Build staging bucket in this project).
#   gcloud builds submit --project=your-gcp-project --config=cloudbuild.yaml .   (from labeling_app/)
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE_REPO}:${BUILD_ID}", "."]
images:
  - "${_IMAGE_REPO}:${BUILD_ID}"
substitutions:
  _IMAGE_REPO: us-central1-docker.pkg.dev/your-gcp-project/your-artifact-repo/sentiment-labeling-app
serviceAccount: projects/your-gcp-project/serviceAccounts/your-service-account@your-gcp-project.iam.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 900s
